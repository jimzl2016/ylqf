<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>艺旅清风 - 智慧监督系统</title>

  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-primary:              #2563EB;
      --color-primary-container:    #DBEAFE;
      --color-on-primary:           #ffffff;
      --color-on-primary-container: #1E3A5F;
      --color-background:                 #FEFDFB;
      --color-surface-container-lowest:   #F8F7F4;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #EFF6FF;
      --color-surface-container-high:     #DBEAFE;
      --color-surface-container-highest:  #BFDBFE;
      --color-on-surface:           #1C1917;
      --color-on-surface-variant:   #78716C;
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      --color-outline:          #D6D3D1;
      --color-outline-variant:  #E7E5E4;
      --radius-sm:   0.5rem;
      --radius-md:   0.75rem;
      --radius-lg:   1rem;
      --radius-xl:   1.25rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      --shadow-card:   0 2px 12px rgba(0,0,0,0.09);
      --shadow-float:  0 8px 30px rgba(0,0,0,0.08);
      --shadow-dialog: 0 20px 60px rgba(0,0,0,0.12);
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
    }
  </style>
</head>

<body class="bg-background text-on-surface font-sans min-h-screen flex items-center justify-center p-6">

  <!-- 背景装饰 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full bg-primary/5 blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-primary-container/60 blur-3xl"></div>
  </div>

  <!-- 登录卡片 -->
  <div class="relative w-full max-w-md">
    <!-- 品牌区域 -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary shadow-float mb-4">
        <i data-lucide="shield-check" class="w-9 h-9 text-on-primary"></i>
      </div>
      <h1 class="text-2xl font-bold text-on-surface">艺旅清风</h1>
      <p class="text-sm text-on-surface-variant mt-1">智慧监督系统</p>
    </div>

    <!-- 登录表单卡片 -->
    <div class="bg-surface rounded-2xl shadow-card p-8 space-y-6">
      <div class="text-center">
        <h2 class="text-lg font-semibold text-on-surface">后台登录</h2>
        <p class="text-xs text-on-surface-variant mt-1">请输入验证码进入系统</p>
      </div>

      <!-- 账号（预填） -->
      <div class="space-y-1.5">
        <label class="text-sm font-medium text-on-surface" for="username">账号</label>
        <div class="relative">
          <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4.5 h-4.5 text-on-surface-variant/50"></i>
          <input id="username" type="text" value="admin" readonly
            class="w-full h-11 pl-10 pr-4 rounded-lg bg-surface-container border border-outline-variant text-sm text-on-surface cursor-default" />
        </div>
      </div>

      <!-- 密码（预填） -->
      <div class="space-y-1.5">
        <label class="text-sm font-medium text-on-surface" for="password">密码</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4.5 h-4.5 text-on-surface-variant/50"></i>
          <input id="password" type="password" value="admin123" readonly
            class="w-full h-11 pl-10 pr-10 rounded-lg bg-surface-container border border-outline-variant text-sm text-on-surface cursor-default" />
          <button id="btn-toggle-pwd" type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-on-surface-variant transition-colors">
            <i data-lucide="eye-off" class="w-4.5 h-4.5"></i>
          </button>
        </div>
      </div>

      <!-- 验证码 -->
      <div class="space-y-1.5">
        <label class="text-sm font-medium text-on-surface" for="captcha">验证码</label>
        <div class="flex gap-3">
          <div class="relative flex-1">
            <i data-lucide="shield-alert" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4.5 h-4.5 text-on-surface-variant/50"></i>
            <input id="captcha" type="text" placeholder="请输入验证码" maxlength="4" autocomplete="off"
              class="w-full h-11 pl-10 pr-4 rounded-lg bg-surface-container border border-outline-variant text-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all" />
          </div>
          <div id="captcha-img" class="w-28 h-11 rounded-lg bg-surface-container-high flex items-center justify-center text-lg font-bold text-on-surface-variant cursor-pointer select-none border border-outline-variant hover:border-primary/30 transition-colors tracking-widest">
            A3K9
          </div>
        </div>
      </div>

      <!-- 登录按钮 -->
      <button id="btn-login" class="w-full h-11 rounded-lg bg-primary text-on-primary text-sm font-semibold hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <span>登 录</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>

      <!-- 提示信息 -->
      <p class="text-xs text-center text-on-surface-variant/60">
        仅限授权人员使用，登录即表示同意
        <a href="#" class="text-primary hover:underline">使用条款</div>
      </p>
    </div>

    <!-- 底部版权 -->
    <p class="text-center text-xs text-on-surface-variant/40 mt-6">
      湖北艺术职业学院 · 纪检监察室
    </p>
  </div>

  <script>
    $(function () {
      lucide.createIcons();

      // 密码显示切换
      var pwdVisible = false;
      $('#btn-toggle-pwd').on('click', function () {
        pwdVisible = !pwdVisible;
        $('#password').attr('type', pwdVisible ? 'text' : 'password');
        $(this).find('i').attr('data-lucide', pwdVisible ? 'eye' : 'eye-off');
        lucide.createIcons();
      });

      // 验证码点击刷新
      $('#captcha-img').on('click', function () {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var code = '';
        for (var i = 0; i < 4; i++) {
          code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        $(this).text(code);
      });

      // 登录提交
      $('#btn-login').on('click', function () {
        var captcha = $('#captcha').val().trim();

        if (!captcha) {
          showToast('请输入验证码', 'warning');
          $('#captcha').focus();
          return;
        }

        var $btn = $(this);
        $btn.prop('disabled', true).html('<span class="inline-block w-4 h-4 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin"></span><span>登录中...</span>');

        setTimeout(function () {
          showToast('登录成功，正在跳转...', 'success');
          setTimeout(function () {
            window.location.href = 'home.html';
          }, 800);
        }, 1000);
      });

      // 回车登录
      $(document).on('keydown', function (e) {
        if (e.key === 'Enter') {
          $('#btn-login').trigger('click');
        }
      });

      // Toast 提示
      function showToast(msg, type) {
        var colors = {
          success: 'bg-success text-white',
          error: 'bg-error text-white',
          warning: 'bg-warning text-white',
          info: 'bg-primary text-white'
        };
        var icons = {
          success: 'check-circle',
          error: 'x-circle',
          warning: 'alert-triangle',
          info: 'info'
        };
        var $toast = $(
          '<div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-lg shadow-dialog text-sm font-medium flex items-center gap-2 animate-slide-down ' + colors[type] + '">' +
          '<i data-lucide="' + icons[type] + '" class="w-4 h-4"></i>' +
          '<span>' + msg + '</span>' +
          '</div>'
        );
        $('body').append($toast);
        lucide.createIcons();
        setTimeout(function () {
          $toast.fadeOut(300, function () { $(this).remove(); });
        }, 2500);
      }
    });
  </script>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 0.8s linear infinite;
    }
    @keyframes slide-down {
      from { opacity: 0; transform: translate(-50%, -12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .animate-slide-down {
      animation: slide-down 0.3s ease-out;
    }
  </style>
</body>
</html>
