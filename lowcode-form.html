<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表单设计器 - 艺旅清风智慧监督系统</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      .designer-container {
        display: grid;
        grid-template-columns: 240px 1fr 320px;
        gap: 16px;
        height: calc(100vh - 140px);
      }
      
      .component-panel {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 16px;
        overflow-y: auto;
      }
      
      .component-section {
        margin-bottom: 20px;
      }
      
      .component-section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      
      .component-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      
      .component-item {
        padding: 12px;
        background: var(--bg-secondary);
        border: 1px dashed var(--border-color);
        border-radius: var(--radius-md);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
      }
      
      .component-item:hover {
        border-color: var(--primary-500);
        background: var(--primary-50);
      }
      
      .component-item i {
        font-size: 20px;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }
      
      .component-item span {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
      }
      
      .canvas-panel {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 24px;
        overflow-y: auto;
      }
      
      .form-canvas {
        max-width: 700px;
        margin: 0 auto;
        min-height: 500px;
        background: var(--bg-secondary);
        border: 2px dashed var(--border-color);
        border-radius: var(--radius-md);
        padding: 32px;
      }
      
      .canvas-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 400px;
        color: var(--text-tertiary);
      }
      
      .canvas-placeholder i {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.5;
      }
      
      .form-field {
        background: var(--bg-primary);
        border: 2px solid transparent;
        border-radius: var(--radius-md);
        padding: 16px;
        margin-bottom: 16px;
        cursor: pointer;
        transition: all 0.2s;
      }
      
      .form-field:hover {
        border-color: var(--primary-300);
      }
      
      .form-field.selected {
        border-color: var(--primary-500);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }
      
      .field-label {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 8px;
      }
      
      .field-label .required {
        color: var(--danger-600);
        margin-left: 4px;
      }
      
      .field-input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 14px;
        background: var(--bg-primary);
      }
      
      .properties-panel {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 16px;
        overflow-y: auto;
      }
      
      .properties-section {
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-color);
      }
      
      .properties-section:last-child {
        border-bottom: none;
      }
      
      .properties-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      
      .property-item {
        margin-bottom: 12px;
      }
      
      .property-label {
        display: block;
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }
      
      .property-input {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 13px;
      }
      
      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      
      .toolbar .btn {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- 侧边栏（简化版） -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">艺</div>
          <div class="sidebar-title">
            <h1>艺旅清风</h1>
            <p>智慧监督系统</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <ul class="nav-menu">
            <li class="nav-item">
              <a href="index.html" class="nav-link">
                <i class="fas fa-th-large icon"></i>
                <span>廉政概览</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link active" data-submenu="lowcode">
                <i class="fas fa-code icon"></i>
                <span>低代码平台</span>
                <i class="fas fa-chevron-right nav-arrow open"></i>
              </a>
              <ul class="nav-submenu open" id="submenu-lowcode">
                <li><a href="lowcode-form.html" class="nav-link active">表单设计器</a></li>
                <li><a href="lowcode-list.html" class="nav-link">列表设计器</a></li>
                <li><a href="lowcode-flow.html" class="nav-link">流程设计器</a></li>
                <li><a href="lowcode-permission.html" class="nav-link">权限配置</a></li>
                <li><a href="lowcode-version.html" class="nav-link">版本管理</a></li>
              </ul>
            </li>
          </ul>
        </nav>

        <div class="sidebar-footer">
          <div class="user-avatar">管</div>
          <div class="user-info">
            <p class="name">管理员</p>
            <p class="dept">纪委办公室</p>
          </div>
        </div>
      </aside>

      <!-- 主内容区 -->
      <main class="main-content">
        <header class="main-header">
          <div class="header-title">
          <h2>湖北艺术职业学院智慧监督系统</h2>
        </div>
          <div class="header-tools">
            <button class="btn btn-sm" onclick="showToast('已预览表单');">
              <i class="fas fa-eye"></i>
              预览
            </button>
            <button class="btn btn-sm" onclick="showToast('已保存表单');">
              <i class="fas fa-save"></i>
              保存
            </button>
            <button class="btn btn-primary btn-sm" onclick="showToast('已发布表单');">
              <i class="fas fa-rocket"></i>
              发布
            </button>
            <button class="header-btn">
              <i class="fas fa-bell"></i>
            </button>
            <button class="header-btn">
              <i class="fas fa-user"></i>
            </button>
          </div>
        </header>

        <div class="page-content" style="padding: 0;">
          <div class="designer-container">
            <!-- 左侧：组件面板 -->
            <div class="component-panel">
              <div class="toolbar">
                <button class="btn btn-sm btn-primary" onclick="showToast('已新建表单');">
                  <i class="fas fa-plus"></i>
                  新建
                </button>
                <button class="btn btn-sm" onclick="showToast('已打开表单模板');">
                  <i class="fas fa-folder-open"></i>
                  模板
                </button>
              </div>

              <div class="component-section">
                <h3 class="component-section-title">基础组件</h3>
                <div class="component-list">
                  <div class="component-item" onclick="showToast('已添加文本框');">
                    <i class="fas fa-font"></i>
                    <span>文本框</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加文本域');">
                    <i class="fas fa-align-left"></i>
                    <span>文本域</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加数字框');">
                    <i class="fas fa-hashtag"></i>
                    <span>数字框</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加下拉框');">
                    <i class="fas fa-list"></i>
                    <span>下拉框</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加日期选择器');">
                    <i class="fas fa-calendar"></i>
                    <span>日期</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加时间选择器');">
                    <i class="fas fa-clock"></i>
                    <span>时间</span>
                  </div>
                </div>
              </div>

              <div class="component-section">
                <h3 class="component-section-title">高级组件</h3>
                <div class="component-list">
                  <div class="component-item" onclick="showToast('已添加单选框');">
                    <i class="fas fa-dot-circle"></i>
                    <span>单选</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加复选框');">
                    <i class="fas fa-check-square"></i>
                    <span>复选</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加上传组件');">
                    <i class="fas fa-upload"></i>
                    <span>图片上传</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加附件');">
                    <i class="fas fa-paperclip"></i>
                    <span>附件</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加用户选择器');">
                    <i class="fas fa-user"></i>
                    <span>用户选择</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加部门选择器');">
                    <i class="fas fa-building"></i>
                    <span>部门选择</span>
                  </div>
                </div>
              </div>

              <div class="component-section">
                <h3 class="component-section-title">布局组件</h3>
                <div class="component-list">
                  <div class="component-item" onclick="showToast('已添加分组标题');">
                    <i class="fas fa-heading"></i>
                    <span>分组标题</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加分割线');">
                    <i class="fas fa-minus"></i>
                    <span>分割线</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加表格');">
                    <i class="fas fa-table"></i>
                    <span>表格</span>
                  </div>
                  <div class="component-item" onclick="showToast('已添加子表单');">
                    <i class="fas fa-clone"></i>
                    <span>子表单</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- 中间：画布区域 -->
            <div class="canvas-panel">
              <div class="form-canvas" id="formCanvas">
                <!-- 示例表单字段 -->
                <div class="form-field" onclick="selectField(this);">
                  <div class="field-label">
                    姓名<span class="required">*</span>
                  </div>
                  <input type="text" class="field-input" placeholder="请输入姓名" value="张三" disabled />
                </div>
                
                <div class="form-field" onclick="selectField(this);">
                  <div class="field-label">
                    部门<span class="required">*</span>
                  </div>
                  <select class="field-input" disabled>
                    <option>教务处</option>
                    <option>财务处</option>
                    <option>后勤处</option>
                  </select>
                </div>
                
                <div class="form-field" onclick="selectField(this);">
                  <div class="field-label">
                    职位
                  </div>
                  <input type="text" class="field-input" placeholder="请输入职位" value="处长" disabled />
                </div>
                
                <div class="form-field" onclick="selectField(this);">
                  <div class="field-label">
                    出生日期
                  </div>
                  <input type="date" class="field-input" value="1970-05-15" disabled />
                </div>
                
                <div class="form-field" onclick="selectField(this);">
                  <div class="field-label">
                    备注说明
                  </div>
                  <textarea class="field-input" placeholder="请输入备注" disabled style="min-height: 80px; resize: vertical;">该同志政治立场坚定，工作认真负责。</textarea>
                </div>
              </div>
            </div>

            <!-- 右侧：属性面板 -->
            <div class="properties-panel">
              <div class="properties-section">
                <h3 class="properties-title">基本属性</h3>
                <div class="property-item">
                  <label class="property-label">字段名称</label>
                  <input type="text" class="property-input" value="姓名" />
                </div>
                <div class="property-item">
                  <label class="property-label">字段标识</label>
                  <input type="text" class="property-input" value="name" />
                </div>
                <div class="property-item">
                  <label class="property-label">占位符</label>
                  <input type="text" class="property-input" value="请输入姓名" />
                </div>
              </div>

              <div class="properties-section">
                <h3 class="properties-title">校验规则</h3>
                <div class="property-item">
                  <label style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" checked />
                    <span class="property-label">必填</span>
                  </label>
                </div>
                <div class="property-item">
                  <label class="property-label">最大长度</label>
                  <input type="number" class="property-input" value="50" />
                </div>
                <div class="property-item">
                  <label class="property-label">正则表达式</label>
                  <input type="text" class="property-input" placeholder="输入正则" />
                </div>
              </div>

              <div class="properties-section">
                <h3 class="properties-title">显示设置</h3>
                <div class="property-item">
                  <label class="property-label">默认值</label>
                  <input type="text" class="property-input" />
                </div>
                <div class="property-item">
                  <label class="property-label">提示文字</label>
                  <input type="text" class="property-input" />
                </div>
                <div class="property-item">
                  <label style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" />
                    <span class="property-label">只读</span>
                  </label>
                </div>
                <div class="property-item">
                  <label style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" />
                    <span class="property-label">隐藏</span>
                  </label>
                </div>
              </div>

              <div class="properties-section">
                <h3 class="properties-title">操作</h3>
                <button class="btn btn-sm w-full" onclick="showToast('已复制字段');">
                  <i class="fas fa-copy"></i>
                  复制
                </button>
                <button class="btn btn-sm w-full" style="margin-top: 8px;" onclick="showToast('已上移字段');">
                  <i class="fas fa-arrow-up"></i>
                  上移
                </button>
                <button class="btn btn-sm w-full" style="margin-top: 8px;" onclick="showToast('已下移字段');">
                  <i class="fas fa-arrow-down"></i>
                  下移
                </button>
                <button class="btn btn-sm w-full" style="margin-top: 8px; border-color: #ef4444; color: #ef4444;" onclick="showToast('已删除字段');">
                  <i class="fas fa-trash"></i>
                  删除
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/scripts/main.js"></script>
    <script>
      function selectField(element) {
        document.querySelectorAll('.form-field').forEach(f => f.classList.remove('selected'));
        element.classList.add('selected');
        showToast('已选中字段，可在右侧编辑属性', 'success');
      }
    </script>
  </body>
</html>
