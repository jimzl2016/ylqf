<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>档案录入 - 艺旅清风智慧监督系统</title>
<link rel="stylesheet" href="/styles/main.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<div id="app" class="app-container">
<aside class="sidebar">
  <div class="sidebar-header"><div class="sidebar-logo">艺</div><div class="sidebar-title"><h1>艺旅清风</h1><p>智慧监督系统</p></div></div>
  <nav class="sidebar-nav"><ul class="nav-menu">
    <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-th-large icon"></i><span>廉政概览</span></a></li>
    <li class="nav-item"><a href="#" class="nav-link active"><i class="fas fa-file-alt icon"></i><span>档案管理</span><i class="fas fa-chevron-down nav-arrow"></i></a><ul class="nav-submenu open">
      <li><a href="archive-list.html" class="nav-link">档案列表</a></li>
      <li><a href="archive-create.html" class="nav-link active">档案录入</a></li>
      <li><a href="archive-opinion.html" class="nav-link">意见管理</a></li>
      <li><a href="archive-recycle.html" class="nav-link">垃圾回收</a></li>
    </ul></li>
    <li class="nav-item"><a href="#" class="nav-link"><i class="fas fa-robot icon"></i><span>AI廉政分析</span></a></li>
    <li class="nav-item"><a href="#" class="nav-link"><i class="fas fa-folder-open icon"></i><span>案件管理</span></a></li>
  </ul></nav>
  <div class="sidebar-footer"><div class="user-avatar">管</div><div class="user-info"><p class="name">管理员</p><p class="dept">纪委办公室</p></div></div>
</aside>
<main class="main-content">
<header class="main-header"><div class="header-title"><h2>湖北艺术职业学院智慧监督系统</h2></div><div class="header-tools"><button class="header-btn"><i class="fas fa-bell"></i></button><button class="header-btn"><i class="fas fa-user"></i></button></div></header>
<div class="page-content">

<div class="page-header">
  <div class="page-title"><h1><span id="formTitle">录入/编辑廉政档案</span></h1><p>人员档案信息管理</p></div>
  <div class="flex gap-2">
    <button class="btn btn-sm" onclick="showToast('已保存为草稿')"><i class="fas fa-save"></i> 暂存</button>
    <button class="btn btn-sm btn-primary" onclick="showToast('档案已保存');"><i class="fas fa-check-circle"></i> 保存</button>
  </div>
</div>

<!-- 分类填报 -->
<div class="card" style="margin-bottom:16px;">
  <div class="card-header"><h3 class="card-title"><i class="fas fa-tags"></i> 档案分类</h3></div>
  <div class="card-body">
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <label class="radio-card checked" onclick="selectCategory(this)">
        <input type="radio" name="category" checked hidden />
        <i class="fas fa-user-graduate"></i>
        <span>领导干部</span>
      </label>
      <label class="radio-card" onclick="selectCategory(this)">
        <input type="radio" name="category" hidden />
        <i class="fas fa-chalkboard-teacher"></i>
        <span>教职工</span>
      </label>
      <label class="radio-card" onclick="selectCategory(this)">
        <input type="radio" name="category" hidden />
        <i class="fas fa-hand-holding-usd"></i>
        <span>高风险岗位</span>
      </label>
      <label class="radio-card" onclick="selectCategory(this)">
        <input type="radio" name="category" hidden />
        <i class="fas fa-users"></i>
        <span>中共党员</span>
      </label>
      <label class="radio-card" onclick="selectCategory(this)">
        <input type="radio" name="category" hidden />
        <i class="fas fa-file-invoice"></i>
        <span>重点监督</span>
      </label>
    </div>
  </div>
</div>

<!-- 基本信息 -->
<div class="card" style="margin-bottom:16px;">
  <div class="card-header"><h3 class="card-title"><i class="fas fa-user-circle"></i> 基本信息</h3></div>
  <div class="card-body">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">姓名 <span style="color:red;">*</span></label><input type="text" class="search-input" style="width:100%;" placeholder="请输入姓名" /></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">性别</label><select class="search-input" style="width:100%;"><option>男</option><option>女</option></select></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">出生年月</label><input type="text" class="search-input" style="width:100%;" placeholder="yyyy-MM" /></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">民族</label><input type="text" class="search-input" style="width:100%;" placeholder="如：汉族" /></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">政治面貌 <span style="color:red;">*</span></label><select class="search-input" style="width:100%;"><option>中共党员</option><option>中共预备党员</option><option>共青团员</option><option>无党派人士</option><option>群众</option></select></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">参加工作时间</label><input type="text" class="search-input" style="width:100%;" placeholder="yyyy-MM" /></div>
    </div>
  </div>
</div>

<!-- 职务信息 -->
<div class="card" style="margin-bottom:16px;">
  <div class="card-header"><h3 class="card-title"><i class="fas fa-briefcase"></i> 职务信息</h3></div>
  <div class="card-body">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">所属部门 <span style="color:red;">*</span></label><select class="search-input" style="width:100%;"><option>教务处</option><option>财务处</option><option>后勤处</option><option>学生处</option><option>科研处</option><option>人事处</option><option>纪委办公室</option><option>招生办</option></select></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">职务 <span style="color:red;">*</span></label><input type="text" class="search-input" style="width:100%;" placeholder="如：教务处处长" /></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">职级</label><select class="search-input" style="width:100%;"><option>正处级</option><option>副处级</option><option>正科级</option><option>副科级</option><option>科员</option><option>其他</option></select></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">任职时间</label><input type="text" class="search-input" style="width:100%;" placeholder="yyyy-MM" /></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">岗位性质</label><select class="search-input" style="width:100%;"><option>行政管理</option><option>专业技术</option><option>工勤技能</option><option>其他</option></select></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">身份状态</label><select class="search-input" style="width:100%;"><option>在职</option><option>退休</option><option>调离</option><option>辞职</option><option>免职</option></select></div>
    </div>
  </div>
</div>

<!-- 廉政信息 -->
<div class="card" style="margin-bottom:16px;">
  <div class="card-header">
    <h3 class="card-title"><i class="fas fa-shield-alt"></i> 廉政信息</h3>
    <div class="flex gap-2">
      <button class="btn btn-sm" onclick="showToast('已添加廉政信息条目')"><i class="fas fa-plus"></i> 添加条目</button>
      <button class="btn btn-sm" onclick="showToast('已保存为常用模板')"><i class="fas fa-star"></i> 存为模板</button>
    </div>
  </div>
  <div class="card-body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">廉政教育情况</label><textarea class="search-input" style="width:100%;min-height:60px;resize:vertical;" placeholder="如：参加廉政教育4次（2023年）"></textarea></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">信访举报情况</label><textarea class="search-input" style="width:100%;min-height:60px;resize:vertical;" placeholder="如有信访举报，请填写相关情况"></textarea></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">谈话函询情况</label><textarea class="search-input" style="width:100%;min-height:60px;resize:vertical;" placeholder="如：2023年接受谈话函询2次"></textarea></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">处分记录</label><textarea class="search-input" style="width:100%;min-height:60px;resize:vertical;" placeholder="如有处分记录请填写"></textarea></div>
    </div>
  </div>
</div>

<!-- 年度考核 -->
<div class="card" style="margin-bottom:16px;">
  <div class="card-header"><h3 class="card-title"><i class="fas fa-calendar-check"></i> 年度考核</h3></div>
  <div class="card-body">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">2023年度</label><select class="search-input" style="width:100%;"><option>优秀</option><option>称职</option><option>基本称职</option><option>不称职</option></select></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">2022年度</label><select class="search-input" style="width:100%;"><option>优秀</option><option selected>称职</option><option>基本称职</option><option>不称职</option></select></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">2021年度</label><select class="search-input" style="width:100%;"><option>优秀</option><option selected>称职</option><option>基本称职</option><option>不称职</option></select></div>
      <div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:4px;">2020年度</label><select class="search-input" style="width:100%;"><option>优秀</option><option>称职</option><option>基本称职</option><option>不称职</option></select></div>
    </div>
  </div>
</div>

<!-- 附件 -->
<div class="card" style="margin-bottom:16px;">
  <div class="card-header"><h3 class="card-title"><i class="fas fa-paperclip"></i> 附件材料</h3>
    <button class="btn btn-sm" onclick="showToast('选择上传文件')"><i class="fas fa-upload"></i> 上传附件</button>
  </div>
  <div class="card-body">
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <div class="file-tag"><i class="fas fa-file-pdf" style="color:#e74c3c;"></i> 个人廉政承诺书.pdf <i class="fas fa-times" onclick="showToast('已删除附件')" style="cursor:pointer;margin-left:4px;"></i></div>
      <div class="file-tag"><i class="fas fa-file-word" style="color:#3498db;"></i> 2023年度述职报告.docx <i class="fas fa-times" onclick="showToast('已删除附件')" style="cursor:pointer;margin-left:4px;"></i></div>
      <div class="file-tag add" onclick="showToast('选择上传文件')"><i class="fas fa-plus"></i> 添加附件</div>
    </div>
  </div>
</div>

<!-- 操作按钮 -->
<div style="display:flex;justify-content:flex-end;gap:8px;padding:16px 0;">
  <button class="btn" onclick="showToast('已取消编辑')"><i class="fas fa-times"></i> 取消</button>
  <button class="btn" onclick="showToast('已保存为草稿')"><i class="fas fa-save"></i> 暂存草稿</button>
  <button class="btn btn-primary" onclick="showToast('档案已保存成功');"><i class="fas fa-check-circle"></i> 保存归档</button>
</div>

</div></main></div>
<script src="/scripts/main.js"></script>
</body>
</html>
