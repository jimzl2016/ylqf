<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>档案录入 - 艺旅清风智慧监督系统</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- 侧边栏（简化版） -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">艺</div>
          <div class="sidebar-title">
            <h1>艺旅清风</h1>
            <p>智慧监督系统</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <ul class="nav-menu">
            <li class="nav-item">
              <a href="index.html" class="nav-link">
                <i class="fas fa-th-large icon"></i>
                <span>廉政概览</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link active" data-submenu="archive">
                <i class="fas fa-file-alt icon"></i>
                <span>档案管理</span>
                <i class="fas fa-chevron-right nav-arrow open"></i>
              </a>
              <ul class="nav-submenu open" id="submenu-archive">
                <li><a href="archive-list.html" class="nav-link">档案列表</a></li>
                <li><a href="archive-create.html" class="nav-link active">档案录入</a></li>
                <li><a href="archive-opinion.html" class="nav-link">意见管理</a></li>
              </ul>
            </li>
          </ul>
        </nav>

        <div class="sidebar-footer">
          <div class="user-avatar">管</div>
          <div class="user-info">
            <p class="name">管理员</p>
            <p class="dept">纪委办公室</p>
          </div>
        </div>
      </aside>

      <!-- 主内容区 -->
      <main class="main-content">
        <header class="main-header">
          <div class="header-title">
            <h2>湖北艺术职业学院智慧监督系统</h2>
          </div>
          <div class="header-tools">
            <button class="header-btn">
              <i class="fas fa-bell"></i>
            </button>
            <button class="header-btn">
              <i class="fas fa-user"></i>
            </button>
          </div>
        </header>

        <div class="page-content">
          <!-- 页面标题 -->
          <div class="page-header">
            <div class="page-title">
              <h1>档案录入 / 编辑</h1>
              <p>人员档案全生命周期管理</p>
            </div>
            <div class="flex items-center gap-2">
              <button class="btn btn-sm" onclick="showToast('已保存草稿'); navigateTo('archive-list.html');">
                <i class="fas fa-save"></i>
                保存草稿
              </button>
              <button class="btn btn-primary btn-sm" onclick="showToast('档案已提交'); navigateTo('archive-list.html');">
                <i class="fas fa-check"></i>
                提交
              </button>
            </div>
          </div>

          <!-- 录入表单 -->
          <div class="card">
            <div class="card-body">
              <!-- Tab切换 -->
              <div class="tabs" style="margin-bottom: 24px;">
                <button class="tab active">基本信息</button>
                <button class="tab" onclick="showToast('切换到奖惩信息');">奖惩信息</button>
                <button class="tab" onclick="showToast('切换到廉政表现');">廉政表现</button>
                <button class="tab" onclick="showToast('切换到廉政谈话');">廉政谈话</button>
                <button class="tab" onclick="showToast('切换到信访举报');">信访举报</button>
                <button class="tab" onclick="showToast('切换到组织处理');">组织处理</button>
                <button class="tab" onclick="showToast('切换到附件材料');">附件材料</button>
              </div>

              <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;">
                <!-- 左侧列 -->
                <div>
                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">姓名 <span style="color: #ef4444;">*</span></label>
                    <input type="text" class="search-input" style="width: 100%;" placeholder="请输入姓名" value="张三" />
                  </div>

                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">性别 <span style="color: #ef4444;">*</span></label>
                    <select class="search-input" style="width: 100%;">
                      <option value="male">男</option>
                      <option value="female">女</option>
                    </select>
                  </div>

                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">部门 <span style="color: #ef4444;">*</span></label>
                    <select class="search-input" style="width: 100%;">
                      <option value="1">教务处</option>
                      <option value="2">财务处</option>
                      <option value="3">后勤处</option>
                      <option value="4">学生处</option>
                    </select>
                  </div>

                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">职位</label>
                    <input type="text" class="search-input" style="width: 100%;" placeholder="请输入职位" value="处长" />
                  </div>

                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">职级</label>
                    <select class="search-input" style="width: 100%;">
                      <option value="1">正处级</option>
                      <option value="2">副处级</option>
                      <option value="3">正科级</option>
                      <option value="4">副科级</option>
                      <option value="5">科员</option>
                    </select>
                  </div>
                </div>

                <!-- 右侧列 -->
                <div>
                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">出生日期</label>
                    <input type="date" class="search-input" style="width: 100%;" value="1970-05-15" />
                  </div>

                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">入党时间</label>
                    <input type="date" class="search-input" style="width: 100%;" value="1995-07-01" />
                  </div>

                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">参加工作时间</label>
                    <input type="date" class="search-input" style="width: 100%;" value="1992-08-01" />
                  </div>

                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">联系电话</label>
                    <input type="text" class="search-input" style="width: 100%;" placeholder="请输入联系电话" value="138****8888" />
                  </div>

                  <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">状态</label>
                    <select class="search-input" style="width: 100%;">
                      <option value="normal">正常</option>
                      <option value="warning">预警</option>
                      <option value="processed">已处理</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- 备注 -->
              <div style="margin-top: 24px;">
                <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500;">备注说明</label>
                <textarea class="search-input" style="width: 100%; min-height: 100px; resize: vertical;" placeholder="请输入备注说明">该同志政治立场坚定，工作认真负责，群众基础良好。</textarea>
              </div>

              <!-- 底部操作栏 -->
              <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border-color);">
                <button class="btn" onclick="showToast('已取消'); navigateTo('archive-list.html');">
                  <i class="fas fa-times"></i>
                  取消
                </button>
                <button class="btn" onclick="showToast('已保存草稿');">
                  <i class="fas fa-save"></i>
                  保存草稿
                </button>
                <button class="btn btn-primary" onclick="showToast('档案已提交，进入审核流程'); navigateTo('archive-list.html');">
                  <i class="fas fa-check"></i>
                  提交审核
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/scripts/main.js"></script>
  </body>
</html>
